<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Berjaya AI Labs Privacy Policy</title>

  <!-- Tells search engines the real, permanent home of this page -->
  <link rel="canonical" href="https://ailabs.berjaya.com.my/privacy-policy.html" />

  <!-- Instant redirect for browsers with JavaScript turned off -->
  <meta http-equiv="refresh" content="0; url=https://ailabs.berjaya.com.my/privacy-policy.html" />

  <meta name="description" content="Berjaya AI Labs has moved to ailabs.berjaya.com.my. You are being redirected." />
  <meta property="og:title" content="Berjaya AI Labs" />
  <meta property="og:url" content="https://ailabs.berjaya.com.my/privacy-policy.html" />
  <meta name="theme-color" content="#050816" />
  <link rel="icon" type="image/png" href="assets/logo.png" />

  <!-- Fastest path: redirect immediately, keeping any ?query or #section the visitor arrived with.
       location.replace() is used so the browser Back button does not bounce them here again. -->
  <script>
    (function () {
      var target = "https://ailabs.berjaya.com.my/privacy-policy.html" + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>

  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #050816;
      color: #e6ebf5;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card { max-width: 32rem; }
    img { width: 88px; height: auto; margin-bottom: 28px; }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 12px; line-height: 1.4; }
    p { font-size: 1rem; line-height: 1.65; color: #a8b3c7; margin: 0 0 28px; }
    a.button {
      display: inline-block;
      padding: 13px 28px;
      border-radius: 999px;
      background: #2f6bff;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.98rem;
    }
    a.button:hover { background: #1d55e0; }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/logo.png" alt="Berjaya AI Labs" />
    <h1>Berjaya AI Labs has a new address</h1>
    <p>We are taking you to <strong>ailabs.berjaya.com.my</strong>. If nothing happens in a moment, use the button below.</p>
    <a class="button" href="https://ailabs.berjaya.com.my/privacy-policy.html">Continue to Berjaya AI Labs</a>
  </main>
</body>
</html>
